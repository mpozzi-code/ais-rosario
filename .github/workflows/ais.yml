name: AIS Rosario

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ais
  cancel-in-progress: false

jobs:
  colectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install websockets==13.1

      - name: Escuchar AIS
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          MINUTOS: "10"
        run: python ais_colector.py

      - name: Guardar datos
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          git add datos/ais.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "AIS $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
