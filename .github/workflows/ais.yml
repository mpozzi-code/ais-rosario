name: AIS Rosario

on:
  schedule:
    - cron: "*/30 * * * *"     # cada 30 minutos (GitHub a veces lo demora unos minutos)
  workflow_dispatch: {}         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: ais
  cancel-in-progress: false

jobs:
  colectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # siempre la última versión, no la del momento en que se programó la corrida

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install websockets==13.1

      - name: Escuchar AIS
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          MINUTOS: "10"
        run: python ais_colector.py

      - name: Guardar datos
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          cp datos/ais.json "$RUNNER_TEMP/ais.json"
          for intento in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/ais.json" datos/ais.json
            git add datos/ais.json
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "AIS $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "Guardado (intento $intento)"; exit 0; fi
            echo "El push falló; reintento en 10 s"
            sleep 10
          done
          echo "No se pudo guardar después de 5 intentos"
          exit 1
